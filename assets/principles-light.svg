  <text x="62" y="35" class="tt">LEAST PRIVILEGE</text><text x="62" y="56" class="ss">one model, nothing else</text></g><g transform="translate(316.0 22)">
  <rect width="276" height="76" rx="18" class="chip"/>
  <rect width="276" height="76" rx="18" class="lit" style="animation-delay:0.9s"/>
  <g transform="translate(34 38)" class="ic" style="animation-delay:0.9s"><path d="M0 -11 L9 -7 V0 C9 6 5 10 0 12 C-5 10 -9 6 -9 0 V-7 Z"/><path d="M-4 0 L4 0"/></g>
  <text x="62" y="35" class="tt">FAIL CLOSED</text><text x="62" y="56" class="ss">unknown means no</text></g><g transform="translate(608.0 22)">
  <rect width="276" height="76" rx="18" class="chip"/>
  <rect width="276" height="76" rx="18" class="lit" style="animation-delay:1.8s"/>
  <g transform="translate(34 38)" class="ic" style="animation-delay:1.8s"><path d="M-11 0 C-7 -7 7 -7 11 0 C7 7 -7 7 -11 0 Z"/><circle cx="0" cy="0" r="3"/></g>
  <text x="62" y="35" class="tt">AI OUTPUT IS UNTRUSTED</text><text x="62" y="56" class="ss">every claim is checked</text></g><g transform="translate(900.0 22)">
