<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="Least privilege. Fail closed. AI output is untrusted. Data stays home.">
<style>
.chip{fill:#ffffff;stroke:#d0d8e8;stroke-width:1.2}
.lit{fill:none;stroke:#C25E00;stroke-width:1.6;opacity:0;animation:lit 3.6s ease-in-out infinite}
.ic{fill:none;stroke:#56627c;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;animation:ic 3.6s ease-in-out infinite}
.tt{font:700 13px ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.12em;fill:#0b1220}
.ss{font:400 13px ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#56627c}
@keyframes lit{0%,100%{opacity:0}12%,30%{opacity:1}45%{opacity:0}}
@keyframes ic{0%,100%{stroke:#56627c}12%,30%{stroke:#C25E00}45%{stroke:#56627c}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><g transform="translate(24.0 22)">
