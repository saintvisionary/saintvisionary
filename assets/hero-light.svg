<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Tyler Bynum. Identity is the new perimeter. Securing humans, machines and AI agents.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9fc"/><stop offset="1" stop-color="#e9eef7"/></linearGradient>
  <linearGradient id="tag" x1="0" x2="1"><stop offset="0" stop-color="#C25E00"/><stop offset="1" stop-color="#E68A00"/></linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FF9900" stop-opacity=".35"/><stop offset="1" stop-color="#FF9900" stop-opacity="0"/></radialGradient>
  <linearGradient id="fadeL" x1="0" x2="1"><stop offset="0" stop-color="#f7f9fc"/><stop offset=".55" stop-color="#f7f9fc" stop-opacity="0"/></linearGradient>
  <linearGradient id="fadeV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f9fc" stop-opacity=".9"/><stop offset=".25" stop-color="#f7f9fc" stop-opacity="0"/><stop offset=".75" stop-color="#e9eef7" stop-opacity="0"/><stop offset="1" stop-color="#e9eef7" stop-opacity=".95"/></linearGradient>
  <clipPath id="card"><rect x="1" y="1" width="1198" height="398" rx="20"/></clipPath>
</defs>
<style>
  .grid line{stroke:#9aa8c7;stroke-width:1;opacity:.16}
  .gridmove{animation:grid 4s linear infinite}
  @keyframes grid{to{transform:translateX(-40px)}}
  .eyebrow{font:600 13px ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.22em;fill:#C25E00}
  .name{font:700 62px ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;letter-spacing:-.035em;fill:#0b1220}
  .tag{font:650 30px ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;letter-spacing:-.02em;fill:url(#tag)}
  .sub{font:400 17px ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#4a5670}
  .cursor{fill:#FF9900;animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .node{fill:#ffffff;stroke:#c3cbdc;stroke-width:1.5}
  .ring{fill:none;stroke-width:2.5;opacity:0}
  .ico{fill:#1d2740}
  .eye{fill:#4C8DFF}
  .lbl{font:600 11px ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.14em;fill:#4a5670;text-anchor:middle}
  .gate{fill:none;stroke:#FF9900;stroke-width:3}
  .gatecore{fill:#FF9900;opacity:.9}
  .gatetxt{font:700 11px ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.2em;fill:#FF9900;text-anchor:middle}
  .chip rect{fill:#ffffff;stroke:#FF453A;stroke-width:1.5}
  .chip text{font:700 12px ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.12em;fill:#FF453A}
  .ok rect{fill:#ffffff;stroke:#30D158;stroke-width:1.5}
  .ok text{font:700 12px ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.12em;fill:#30D158}

  .a .mv,.b .mv{animation:pass 7.5s cubic-bezier(.45,0,.25,1) infinite}
  .b .mv{animation-delay:-2.50s}
  .c .mv{animation:block 7.5s cubic-bezier(.45,0,.25,1) infinite;animation-delay:-5.00s}
  .a .ring,.b .ring{animation:okring 7.5s linear infinite}
  .b .ring{animation-delay:-2.50s}
  .c .ring{animation:badring 7.5s linear infinite;animation-delay:-5.00s}
  .chip{animation:chip 7.5s linear infinite;animation-delay:-5.00s;opacity:0}
  .gateflash{animation:flash 7.5s linear infinite;animation-delay:-5.00s}
  .halo{animation:halo 3s ease-in-out infinite;transform-origin:905px 200px}
  .scan{animation:scan 2.4s ease-in-out infinite}

  @keyframes pass{0%{transform:translateX(0);opacity:0}8%{opacity:1}42%{transform:translateX(196px)}54%{transform:translateX(196px)}90%{transform:translateX(470px);opacity:1}100%{transform:translateX(490px);opacity:0}}
  @keyframes block{0%{transform:translateX(0);opacity:0}8%{opacity:1}42%{transform:translateX(196px)}46%{transform:translateX(188px)}49%{transform:translateX(196px)}52%{transform:translateX(190px)}55%,84%{transform:translateX(196px);opacity:1}96%,100%{transform:translateX(184px);opacity:0}}
  @keyframes okring{0%,45%{opacity:0;stroke:#30D158}50%,92%{opacity:1;stroke:#30D158}100%{opacity:0;stroke:#30D158}}
  @keyframes badring{0%,44%{opacity:0;stroke:#FF453A}48%,86%{opacity:1;stroke:#FF453A}96%,100%{opacity:0;stroke:#FF453A}}
  @keyframes chip{0%,47%{opacity:0;transform:translateY(6px)}52%,84%{opacity:1;transform:translateY(0)}94%,100%{opacity:0}}
  @keyframes flash{0%,44%{stroke:#FF9900}47%,84%{stroke:#FF453A}92%,100%{stroke:#FF9900}}
  @keyframes halo{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
  @keyframes scan{0%,100%{transform:translateY(-70px);opacity:0}20%,80%{opacity:1}50%{transform:translateY(70px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.mv{opacity:1}.chip{opacity:1}}
</style>
<g clip-path="url(#card)">
  <rect width="1200" height="400" fill="url(#bg)"/>
  <g class="grid"><g class="gridmove"><line x1="0" y1="0" x2="0" y2="400"/><line x1="40" y1="0" x2="40" y2="400"/><line x1="80" y1="0" x2="80" y2="400"/><line x1="120" y1="0" x2="120" y2="400"/><line x1="160" y1="0" x2="160" y2="400"/><line x1="200" y1="0" x2="200" y2="400"/><line x1="240" y1="0" x2="240" y2="400"/><line x1="280" y1="0" x2="280" y2="400"/><line x1="320" y1="0" x2="320" y2="400"/><line x1="360" y1="0" x2="360" y2="400"/><line x1="400" y1="0" x2="400" y2="400"/><line x1="440" y1="0" x2="440" y2="400"/><line x1="480" y1="0" x2="480" y2="400"/><line x1="520" y1="0" x2="520" y2="400"/><line x1="560" y1="0" x2="560" y2="400"/><line x1="600" y1="0" x2="600" y2="400"/><line x1="640" y1="0" x2="640" y2="400"/><line x1="680" y1="0" x2="680" y2="400"/><line x1="720" y1="0" x2="720" y2="400"/><line x1="760" y1="0" x2="760" y2="400"/><line x1="800" y1="0" x2="800" y2="400"/><line x1="840" y1="0" x2="840" y2="400"/><line x1="880" y1="0" x2="880" y2="400"/><line x1="920" y1="0" x2="920" y2="400"/><line x1="960" y1="0" x2="960" y2="400"/><line x1="1000" y1="0" x2="1000" y2="400"/><line x1="1040" y1="0" x2="1040" y2="400"/><line x1="1080" y1="0" x2="1080" y2="400"/><line x1="1120" y1="0" x2="1120" y2="400"/><line x1="1160" y1="0" x2="1160" y2="400"/><line x1="1200" y1="0" x2="1200" y2="400"/><line x1="1240" y1="0" x2="1240" y2="400"/><line x1="1280" y1="0" x2="1280" y2="400"/><line x1="0" y1="0" x2="1300" y2="0"/><line x1="0" y1="40" x2="1300" y2="40"/><line x1="0" y1="80" x2="1300" y2="80"/><line x1="0" y1="120" x2="1300" y2="120"/><line x1="0" y1="160" x2="1300" y2="160"/><line x1="0" y1="200" x2="1300" y2="200"/><line x1="0" y1="240" x2="1300" y2="240"/><line x1="0" y1="280" x2="1300" y2="280"/><line x1="0" y1="320" x2="1300" y2="320"/><line x1="0" y1="360" x2="1300" y2="360"/><line x1="0" y1="400" x2="1300" y2="400"/></g></g>
  <rect width="1200" height="400" fill="url(#fadeV)"/>
  <rect width="1200" height="400" fill="url(#fadeL)"/>

  <!-- identity gate -->
  <ellipse class="halo" cx="905" cy="200" rx="90" ry="150" fill="url(#glow)"/>
  <rect class="gate gateflash" x="893" y="66" width="24" height="270" rx="12"/>
  <rect class="gatecore scan" x="899" y="185" width="12" height="30" rx="6"/>
  <text x="905" y="56" class="gatetxt">IDENTITY GATE</text>
  
  <g class="a" transform="translate(0 114)">
    <g class="mv">
      <circle cx="650" cy="0" r="27" class="node"/>
      <circle cx="650" cy="0" r="27" class="ring"/>
      <g transform="translate(650 0)" class="ico"><circle cx="0" cy="-6" r="6"/><path d="M-11 12 C-11 2 -5 -1 0 -1 C5 -1 11 2 11 12 Z"/></g>
      <text x="650" y="44" class="lbl">HUMAN</text>
    </g>
  </g>
  
  <g class="b" transform="translate(0 200)">
    <g class="mv">
      <circle cx="650" cy="0" r="27" class="node"/>
      <circle cx="650" cy="0" r="27" class="ring"/>
      <g transform="translate(650 0)" class="ico"><rect x="-11" y="-12" width="22" height="9" rx="2.5"/><rect x="-11" y="-1" width="22" height="9" rx="2.5"/><rect x="-11" y="10" width="22" height="3" rx="1.5" opacity=".5"/></g>
      <text x="650" y="44" class="lbl">SERVICE</text>
    </g>
  </g>
  
  <g class="c" transform="translate(0 286)">
    <g class="mv">
      <circle cx="650" cy="0" r="27" class="node"/>
      <circle cx="650" cy="0" r="27" class="ring"/>
      <g transform="translate(650 0)" class="ico"><rect x="-12" y="-9" width="24" height="19" rx="6"/><rect x="-1" y="-15" width="2" height="6" rx="1"/><circle cx="0" cy="-16" r="2.2"/><circle cx="-5" cy="0" r="2.3" class="eye"/><circle cx="5" cy="0" r="2.3" class="eye"/></g>
      <text x="650" y="44" class="lbl">AI AGENT</text>
    </g>
  </g>
  <g class="chip"><rect x="934" y="271" width="226" height="30" rx="15"/><text x="1047" y="291" text-anchor="middle">DENIED · NO HUMAN OWNER</text></g>

  <!-- words -->
  <text x="64" y="112" class="eyebrow">IAM · AI AGENT SECURITY · SECOPS</text>
  <text x="62" y="186" class="name">Tyler Bynum</text>
  <text x="64" y="236" class="tag">Identity is the new perimeter.</text>
  <text x="64" y="276" class="sub">Securing humans, machines and AI agents.</text>
  <text x="64" y="302" class="sub">Least privilege, a human owner, and a full audit trail.</text>
</g>
<rect x="1" y="1" width="1198" height="398" rx="20" fill="none" stroke="#d5dcea"/>
</svg>